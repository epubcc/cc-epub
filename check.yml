name: Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (libopencc)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencc-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install opencc beautifulsoup4

      - name: Syntax check
        run: |
          python -m compileall converter.py install.sh e2e.py audit.py test_converter.py

      - name: Verify project structure
        run: |
          test -f converter.py
          test -f install.sh
          test -f e2e.py
          test -f README.md
          test -f DEPLOY.md
          test -d .github/workflows
          echo "Structure OK"

      - name: Run unit tests
        run: |
          python test_converter.py

      - name: Run audit suite
        run: |
          python audit.py

      - name: End-to-end (real EPUB)
        env:
          EBOOK_OUT: ${{ github.workspace }}/out
        run: |
          mkdir -p "$EBOOK_OUT"
          python e2e.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-py${{ matrix.python-version }}
          path: |
            out/
            *.epub

      - name: Require green verdict
        run: |
          if [ -f ci_result.json ]; then
            python -c "import json; d=json.load(open('ci_result.json')); assert d.get('verdict')=='ALL GREEN', d"
          fi
          echo "ALL GREEN"
