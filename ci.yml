name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencc-dev opencc python3 python3-pip zip unzip

      - name: Verify scripts syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/cc.sh
          bash -n scripts/uninstall.sh
          python3 -m py_compile scripts/convert.py
          echo "✓ All scripts pass syntax check"

      - name: Test convert.py --help
        run: |
          python3 scripts/convert.py --help
