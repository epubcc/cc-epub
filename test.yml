name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shellcheck cc-epub.sh install.sh lib/*.sh tests/*.sh
          shellcheck --severity=warning cc-epub.sh install.sh lib/*.sh tests/*.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, dash]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y opencc unzip zip python3 python3-pil imagemagick
      - name: Run tests
        run: |
          bash tests/run_tests.sh
      - name: Test install script (dry)
        run: |
          bash install.sh --dry-install

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full install simulation
        run: |
          sudo apt-get update
          sudo apt-get install -y opencc unzip zip python3 imagemagick git curl shellcheck
          # 模拟 Termux 环境
          export PREFIX="/usr/local"
          export HOME="/tmp/home"
          mkdir -p "$HOME"
          # 验证脚本语法
          bash -n cc-epub.sh && echo "cc-epub.sh OK"
          bash -n install.sh && echo "install.sh OK"
          # 运行完整测试
          bash tests/run_tests.sh
